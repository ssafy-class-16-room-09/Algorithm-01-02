name: 풀이 제출 검사

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: submission-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 제출 경로 규칙 검사
        id: rules
        uses: actions/github-script@v7
        with:
          script: |
            const mod = await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/check-submission.mjs`);
            await mod.run({ github, context, core });

      - uses: actions/setup-java@v4
        if: steps.rules.outputs.java_count != '0'
        with:
          distribution: temurin
          java-version: '17'

      - name: Java 컴파일 검사
        id: java_compile
        if: steps.rules.outputs.java_count != '0'
        continue-on-error: true
        env:
          DIRS: ${{ steps.rules.outputs.dirs }}
        run: |
          set +e
          set -uo pipefail
          status=0
          : > compile.log
          # SWEA/프로그래머스 Java 풀이는 보통 클래스명이 Solution이라 서로 충돌한다.
          # 제출자 폴더 단위로 따로 컴파일해서 이를 피한다.
          for dir in $DIRS; do
            mapfile -t files < <(find "$dir" -name '*.java')
            if [ ${#files[@]} -eq 0 ]; then
              continue
            fi
            out="build/$(echo "$dir" | tr '/' '_')"
            mkdir -p "$out"
            echo "==> javac $dir" >> compile.log
            if ! javac -encoding UTF-8 -d "$out" "${files[@]}" >>compile.log 2>&1; then
              status=1
            fi
          done
          cat compile.log
          exit $status

      - uses: actions/setup-python@v5
        if: steps.rules.outputs.python_count != '0'
        with:
          python-version: '3.x'

      - name: Python 문법 검사
        id: python_compile
        if: steps.rules.outputs.python_count != '0'
        continue-on-error: true
        env:
          PYTHON_FILES: ${{ steps.rules.outputs.python_files }}
        run: |
          set +e
          set -uo pipefail
          status=0
          : > python-compile.log
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            echo "==> python -m py_compile $file" >> python-compile.log
            if ! PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m py_compile "$file" >>python-compile.log 2>&1; then
              status=1
            fi
          done <<< "$PYTHON_FILES"
          cat python-compile.log
          exit $status

      - name: 결과 댓글
        if: always() && steps.rules.outcome == 'success'
        uses: actions/github-script@v7
        env:
          JAVA_COMPILE_RESULT: ${{ steps.java_compile.outcome }}
          PYTHON_COMPILE_RESULT: ${{ steps.python_compile.outcome }}
        with:
          script: |
            const fs = require('fs');
            process.env.JAVA_COMPILE_LOG = fs.existsSync('compile.log')
              ? fs.readFileSync('compile.log', 'utf8')
              : '';
            process.env.PYTHON_COMPILE_LOG = fs.existsSync('python-compile.log')
              ? fs.readFileSync('python-compile.log', 'utf8')
              : '';
            const mod = await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/check-submission.mjs`);
            await mod.report({ github, context, core });
